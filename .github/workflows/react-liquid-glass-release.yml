name: react-liquid-glass release

# Publishes packages/react-liquid-glass to npm and GitHub Packages.
# Trigger: push a tag like `react-liquid-glass-v0.1.0` (must match package.json "version").
# Requires the repository secret NPM_TOKEN (an npm granular access token with publish rights).

on:
  push:
    tags: ["react-liquid-glass-v*"]
  workflow_dispatch:

defaults:
  run:
    working-directory: packages/react-liquid-glass

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
      packages: write # GitHub Packages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/react-liquid-glass/package-lock.json
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#react-liquid-glass-v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "Tag version $TAG does not match package.json version $VERSION" >&2
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@aliajafari"

      - name: Publish to GitHub Packages
        # GitHub Packages only accepts names scoped to the repository owner.
        run: |
          npm pkg set name=@aliajafari/react-liquid-glass
          npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
