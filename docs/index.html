<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Liquid Glass with WebGL</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
    <nav class="project-links" aria-label="Project links" data-html2canvas-ignore="true">
      <a href="https://github.com/aliajafari/Liquid-Glass-with-WebGL" target="_blank" rel="noopener">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        GitHub
      </a>
      <a href="https://www.npmjs.com/package/react-webgl-liquid-glass" target="_blank" rel="noopener">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="#cb3837" d="M0 0h16v16H0z"/><path fill="#fff" d="M3 3h10v10h-2.5V5.5H8V13H3z"/></svg>
        npm
      </a>
    </nav>
    <style>
      .project-links { position: fixed; top: 16px; right: 16px; z-index: 1000; display: flex; gap: 8px; font: 600 14px/1 system-ui, -apple-system, "Segoe UI", sans-serif; }
      .project-links a { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px; color: #fff; text-decoration: none; background: rgba(15, 18, 30, 0.55); border: 1px solid rgba(255, 255, 255, 0.18); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: background 0.15s; }
      .project-links a:hover { background: rgba(15, 18, 30, 0.8); }
      .project-links a:focus-visible { outline: 2px solid #9ec5ff; outline-offset: 2px; }
      @media (max-width: 640px) { .project-links { position: static; justify-content: flex-end; padding: 12px 16px 0; } }
    </style>

  <div class="container" id="container">
    <img class="bg-image" src="./background.jpg" crossorigin="anonymous" alt="" />
    <div class="bg-overlay"></div>

    <div class="big-text">LIQUID GLASS</div>

    <div class="cards">
      <div class="card">React</div>
      <div class="card">WebGL</div>
      <div class="card">Shader</div>
    </div>

    <div class="glass" id="glass" data-html2canvas-ignore="true">
      <canvas class="glass-canvas" id="glassCanvas"></canvas>
      <div class="glass-fallback" id="glassFallback"></div>

      <div class="glass-content">
        <h2>Glass Card</h2>
        <p>Real HTML content inside a WebGL-powered glass div.</p>
        <button>Action</button>
      </div>
    </div>

    <div class="performance-box" id="performanceBox" data-html2canvas-ignore="true">
      <strong>Performance</strong>
      <div>Mode: <span id="modeValue">WebGL</span></div>
      <div>FPS: <span id="fpsValue">0</span></div>
      <div>Frame: <span id="frameValue">0</span>ms</div>
      <div>Snapshot: <span id="snapshotValue">0</span>ms</div>
      <div>Texture Upload: <span id="uploadValue">0</span>ms</div>
      <div>DPR: <span id="dprValue">1</span></div>
      <div>Resolution: <span id="resolutionValue">0x0</span></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script type="module">
    import { createLiquidGlass } from "./js/glass-effect.js";

    createLiquidGlass({
      container: "#container",
      glass: "#glass",
      canvas: "#glassCanvas",
      fallback: "#glassFallback",
      performanceBox: {
        mode: "#modeValue",
        fps: "#fpsValue",
        frame: "#frameValue",
        snapshot: "#snapshotValue",
        upload: "#uploadValue",
        dpr: "#dprValue",
        resolution: "#resolutionValue"
      },
      effect: {
        radius: 45,
        blur: 10,
        distortion: 30,
        zoom: 35,
        chromaticAberration: 20,
        frost: 8,
        frostScale: 50,
        light: 30,
        edgeGlow: 40,
        edgeWidth: 25,
        tint: 94,
        alpha: 97
      },
      performance: {
        maxDpr: 1.25,
        targetFps: 60,
        animateGlass: true
      }
    });
  </script>
</body>
</html>
